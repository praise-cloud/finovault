<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- FinoVault — flat 2D brutalist mark. Transparent background, bold black
       outlines throughout so the mark reads clearly on any background color. -->

  <!-- Vault hinge barrel (right side) -->
  <g stroke="#000000" stroke-width="10" stroke-linejoin="round">
    <rect x="336" y="150" width="120" height="212" rx="16" fill="#14239E"/>
    <circle cx="486" cy="256" r="26" fill="#14239E"/>
    <rect x="486" y="246" width="26" height="20" fill="#14239E"/>
  </g>
  <circle cx="486" cy="256" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>

  <!-- Hinge bolts -->
  <circle cx="366" cy="196" r="13" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
  <circle cx="366" cy="256" r="13" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
  <circle cx="366" cy="316" r="13" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>

  <!-- Main vault-door coin -->
  <circle cx="230" cy="256" r="198" fill="#1B3FE0" stroke="#000000" stroke-width="16"/>
  <circle cx="230" cy="256" r="160" fill="none" stroke="#000000" stroke-width="7"/>

  <!-- Flat geometric "F" -->
  <polygon
    points="0,0 140,0 140,45 45,45 45,90 115,90 115,133 45,133 45,195 0,220"
    fill="#FFFFFF"
    stroke="#000000"
    stroke-width="8"
    stroke-linejoin="round"
    transform="translate(158,138) scale(1.05)"
  />
</svg>
